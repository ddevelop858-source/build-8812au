<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikol Tenis</title>
    <style>
        /* СТИЛИ: делаем красиво */
        body { 
            margin: 0; 
            background: #1a1c2c; 
            color: white; 
            font-family: sans-serif; 
            padding: 15px;
        }
        .card { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            padding: 15px; 
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1, h2 { color: #ff9f43; }
        input { 
            width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; 
            border: none; background: #2f3542; color: white; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 10px; border-radius: 8px; border: none; 
            background: #ff9f43; color: white; font-weight: bold; margin-top: 5px;
        }
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .photo-box { height: 80px; background: #57606f; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        #chat { height: 100px; background: #2f3542; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>NIKOL TENIS</h1>

    <div class="card">
        <h2>1. Друзья</h2>
        <input type="text" placeholder="Имя друга">
        <button>ДОБАВИТЬ</button>
    </div>

    <div class="card">
        <h2>2. Галерея</h2>
        <div class="gallery-grid">
            <div class="photo-box">Match 1</div>
            <div class="photo-box">Match 2</div>
            <div class="photo-box">Training</div>
            <div class="photo-box">Team</div>
        </div>
        <button>ЗАГРУЗИТЬ ФОТО</button>
    </div>

    <div class="card">
        <h2>ЧАТ СООБЩЕСТВА</h2>
        <div id="chat">...</div>
        <input type="text" id="msg" placeholder="Твой ответ...">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        function send() {
            let m = document.getElementById('msg').value;
            if(m) document.getElementById('chat').innerHTML += "<div>" + m + "</div>";
            document.getElementById('msg').value = "";
        }
    </script>
</body>
</html>
