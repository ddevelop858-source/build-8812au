<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikol Tenis - Проект</title>
    <style>
        :root { --accent: #ff9f43; --bg-card: rgba(255, 255, 255, 0.1); }
        body { 
            margin: 0; background: #1a1c2c; color: white; 
            font-family: 'Segoe UI', sans-serif; padding: 20px; 
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }
        .container { max-width: 450px; margin: auto; }
        .card { 
            background: var(--bg-card); backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
        }
        input { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; 
            border: none; background: rgba(0,0,0,0.3); color: white; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            background: var(--accent); color: white; font-weight: bold; cursor: pointer;
        }
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .photo-box { height: 100px; background: #4a192c; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
        #app-screen { display: none; }
    </style>
</head>
<body>

<div id="auth-screen" class="container">
    <div class="card" style="margin-top: 100px;">
        <h2 style="text-align:center; color: var(--accent);">NIKOL TENIS</h2>
        <input type="text" id="username" placeholder="Имя игрока">
        <input type="password" id="pass" placeholder="Пароль">
        <button onclick="login()">ВОЙТИ</button>
    </div>
</div>

<div id="app-screen" class="container">
    <h1 style="text-align:center;">NIKOL TENIS</h1>
    
    <div class="card">
        <h3>Друзья</h3>
        <input type="text" placeholder="ID игрока">
        <button>ДОБАВИТЬ В КОМАНДУ</button>
    </div>

    <div class="card">
        <h3>Галерея матчей</h3>
        <div class="gallery-grid">
            <div class="photo-box">📸</div>
            <div class="photo-box">📸</div>
        </div>
        <button style="margin-top:10px;">ЗАГРУЗИТЬ ФОТО</button>
    </div>

    <div class="card">
        <h3>Чат</h3>
        <div id="chat" style="height: 100px; overflow-y:auto; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px; font-size: 14px;">
            Система: Добро пожаловать!
        </div>
        <input type="text" id="msg" placeholder="Сообщение...">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>
</div>

<script>
    function login() {
        const u = document.getElementById('username').value;
        if(u) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        }
    }
    function send() {
        const m = document.getElementById('msg').value;
        if(m) {
            document.getElementById('chat').innerHTML += `<br><b>Вы:</b> ${m}`;
            document.getElementById('msg').value = '';
        }
    }
</script>
</body>
</html>
